<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer
  ></script>

  <script src="js/supabase.js?v=3" defer></script>
  <script src="js/agenda.js?v=3" defer></script>

  <title>Agenda | Barber House</title>
  </head>
  <body>
    <header class="cabecalho">
      <a href="index.html" class="logo">Barber House</a>
      <nav class="menu">
        <a href="index.html">Novo agendamento</a>
        <button type="button" id="botao-sair">Sair</button>
      </nav>
    </header>
    <main class="pagina-agenda">
      <section class="cabecalho-agenda">
        <p class="destaque">PAINEL DA BARBEARIA</p>
        <h1>Agenda de atendimentos</h1>
        <p>Acompanhe os horários e atendimentos da equipe.</p>
      </section>
      <div class="conteudo-painel">
      <section class="painel-agenda">
        <div class="filtros-agenda">
          <div class="campo">
            <label for="filtro-data">Data</label>
            <input type="date" id="filtro-data" />
          </div>

          <div class="campo">
            <label for="filtro-barbeiro">Barbeiro</label>
            <select name="filtro-barbeiro" id="filtro-barbeiro">
              <option value="">Todos os barbeiros</option>
            </select>
          </div>
          <div class="campo">
            <label for="filtro-status">Status</label>
            <select name="filtro-status" id="filtro-status">
              <option value="">Todos os status</option>
              <option value="agendado">Agendados</option>
              <option value="concluido">Concluído</option>
              <option value="cancelado">Cancelado</option>
            </select>
          </div>
        </div>
        <p id="resumo-agenda" class="resumo-agenda"></p>
        <div id="lista-agendamentos" class="lista-agendamentos"></div>
      </section>
      
      <section class="painel-ranking">
        <div class="cabecalho-ranking">
          <p class="destaque">DESEMPENHO DO MÊS</p>
          <h2>Ranking dos barbeiros</h2>
        </div>
        <div id="lista-ranking" class="lista-ranking">
          <p class="agenda-vazia">Carregando ranking...</p>
        </div>
      </section>
      </div>
    </main>
  </body>
</html>
